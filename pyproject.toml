[project]
name = "chess-rlvr"
version = "0.1.0"
description = "Teaching a language model a chess world model: board state, rules, and move values before answering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["python-chess>=1.11"]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.44", "peft>=0.12", "trl>=0.12",
         "datasets>=3.0", "accelerate>=1.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
